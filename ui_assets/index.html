<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Agentic Job Search</title>

    <link rel="stylesheet" href="/assets/styles.css" />
  </head>

  <body>
    <main class="shell">
      <header>
        <div class="brand">
          <div class="mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path
                d="M10.8 18.6a7.8 7.8 0 1 1 5.5-2.3l4 4"
                stroke="currentColor"
                stroke-width="2.3"
                stroke-linecap="round"
              />
            </svg>
          </div>

          Agentic Job Search
        </div>

        <div class="status-pill" id="status-pill">Vespa Cloud | Agentic</div>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="eyebrow hero-eyebrow">AI-ASSISTED JOB DISCOVERY</div>

        <h1 id="page-title">Find jobs that actually fit.</h1>

        <p class="lede">
          The search agent interprets your intent, chooses a retrieval strategy,
          filters candidates, and explains why each job matched.
        </p>
      </section>

      <section class="search-panel" aria-label="Job search">
        <form id="search-form">
          <label class="search-input-wrap">
            <svg
              class="search-icon"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M10.8 18.6a7.8 7.8 0 1 1 5.5-2.3l4 4"
                stroke="currentColor"
                stroke-width="2.1"
                stroke-linecap="round"
              />
            </svg>

            <input
              id="query"
              name="query"
              type="search"
              placeholder='Try "React Node.js full stack developer"'
              autocomplete="off"
              autofocus
            />
          </label>

          <label class="filter-wrap">
            <span class="filter-label"> Max results </span>

            <input
              id="max-results"
              name="max-results"
              type="number"
              min="1"
              max="100"
              value="10"
              inputmode="numeric"
              aria-label="Maximum results"
            />
          </label>

          <button id="search-button" type="submit">
            <span id="button-label"> Search </span>
          </button>
        </form>

        <div class="meta-row">
          <span id="summary"> Ready when you are. </span>

          <span id="ranking-summary"> Agentic ranking </span>
        </div>
      </section>

      <div class="suggestions" aria-label="Suggested searches">
        <button class="chip" type="button" data-query="Software Engineer">
          Software Engineer
        </button>

        <button
          class="chip"
          type="button"
          data-query="React Node.js full stack developer"
        >
          React + Node.js
        </button>

        <button
          class="chip"
          type="button"
          data-query="Machine Learning Engineer"
        >
          Machine Learning Engineer
        </button>

        <button
          class="chip"
          type="button"
          data-query="entry level software engineer"
        >
          Entry-Level Software Engineer
        </button>
      </div>

      <section id="results" class="results" aria-live="polite"></section>

      <nav
        id="pagination"
        class="pagination"
        aria-label="Search results pages"
      ></nav>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
